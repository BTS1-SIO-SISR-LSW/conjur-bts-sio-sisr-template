[ req ]
default_bits       = 2048
default_md         = sha256
prompt             = no
distinguished_name = dn
x509_extensions    = v3_ca

[ dn ]
C  = FR
ST = Auvergne-Rhone-Alpes
L  = Saint-Priest-en-Jarez
O  = BTS SIO
OU = SISR
CN = proxy

[ v3_ca ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = proxy
DNS.2 = localhost
IP.1  = 127.0.0.1
